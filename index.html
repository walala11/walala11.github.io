<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>从石库门到南湖红船：红色起点的数字化再现</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="deck-shell">
    <main id="deck" aria-live="polite"></main>

    <nav class="deck-controls" aria-label="H5 翻页控制">
      <button id="prevBtn" type="button" aria-label="上一页">上一页</button>
      <div id="dots" class="dots" aria-label="页码导航"></div>
      <button id="nextBtn" type="button" aria-label="下一页">下一页</button>
    </nav>

    <div class="page-indicator">
      <span id="pageNow">1</span>/<span id="pageTotal">16</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
